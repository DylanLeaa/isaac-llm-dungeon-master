name: Release

# Builds the Windows exe and publishes a GitHub release when a commit carrying a version tag
# (v*) lands on main. Tag the commit on your branch and push the tag, then merge the PR:
#   git tag v0.0.3 && git push origin v0.0.3
# Merges with no tagged commit do nothing. Use a merge commit or rebase: a squash merge
# creates a new commit, so the tag stays behind on the branch and nothing is released.
on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      BEFORE: ${{ github.event.before }}
    steps:
      # Actions are pinned to a commit: a tag can be moved to other code, a SHA can't.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # need the tags and the history behind the push

      # Looks at every commit this push added to main and takes the highest v* tag on them.
      # TAG stays empty when there is none, which skips every step below.
      - name: Find version tag
        shell: pwsh
        run: |
          $range = if ($env:BEFORE -match '^0+$') { "HEAD" } else { "$env:BEFORE..HEAD" }
          $tag = git rev-list $range |
            ForEach-Object { git tag --points-at $_ --list "v*" } |
            Sort-Object { [version]($_ -replace '^v', '') } |
            Select-Object -Last 1
          "TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          if ($tag) { "Releasing $tag" } else { "No version tag in this push, nothing to release" }

      - if: env.TAG != ''
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-build.txt

      - name: Run tests
        if: env.TAG != ''
        shell: pwsh
        run: |
          python -m pip install -r backend/requirements.txt -r backend/requirements-build.txt
          python -m pytest tests --ignore=tests/live_smoke.py --ignore=tests/probe_models.py -q

      - name: Build exe
        if: env.TAG != ''
        shell: pwsh
        run: ./backend/build.ps1

      - name: Zip exe
        if: env.TAG != ''
        shell: pwsh
        run: |
          Compress-Archive -Path "backend/dist/LLM Dungeon Master.exe" -DestinationPath "LLM-Dungeon-Master-$env:TAG-windows.zip"

      - name: Publish release
        if: env.TAG != ''
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ env.TAG }}
          generate_release_notes: true
          files: |
            LLM-Dungeon-Master-${{ env.TAG }}-windows.zip
            backend/dist/LLM Dungeon Master.exe
