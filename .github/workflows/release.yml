name: Release

# Builds the Windows exe and publishes a GitHub release whenever a version tag (v*) is pushed.
#   git tag v0.0.3 && git push origin v0.0.3
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      # Used as $env:TAG, never pasted into a script: a tag name is just text, not code.
      TAG: ${{ github.ref_name }}
    steps:
      # Actions are pinned to a commit: a tag can be moved to other code, a SHA can't.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-build.txt

      - name: Run tests
        shell: pwsh
        run: |
          python -m pip install -r backend/requirements.txt -r backend/requirements-build.txt
          python -m pytest tests --ignore=tests/live_smoke.py --ignore=tests/probe_models.py -q

      - name: Build exe
        shell: pwsh
        run: ./backend/build.ps1

      - name: Zip exe
        shell: pwsh
        run: |
          Compress-Archive -Path "backend/dist/LLM Dungeon Master.exe" -DestinationPath "LLM-Dungeon-Master-$env:TAG-windows.zip"

      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          generate_release_notes: true
          files: |
            LLM-Dungeon-Master-${{ env.TAG }}-windows.zip
            backend/dist/LLM Dungeon Master.exe
