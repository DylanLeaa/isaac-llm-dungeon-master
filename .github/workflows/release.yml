name: Release

# Builds the Windows exe and publishes a GitHub release whenever a version tag (v*) is pushed.
#   git tag v0.0.3 && git push origin v0.0.3
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Run tests
        shell: pwsh
        run: |
          python -m pip install -r backend/requirements.txt pytest
          python -m pytest tests --ignore=tests/live_smoke.py --ignore=tests/probe_models.py -q

      - name: Build exe
        shell: pwsh
        run: ./backend/build.ps1

      - name: Zip exe
        shell: pwsh
        run: Compress-Archive -Path "backend/dist/LLM Dungeon Master.exe" -DestinationPath "LLM-Dungeon-Master-${{ github.ref_name }}-windows.zip"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            LLM-Dungeon-Master-${{ github.ref_name }}-windows.zip
            backend/dist/LLM Dungeon Master.exe
